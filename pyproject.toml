[project]
name = "spiel"
version = "0.1.0"
description = "TypeRacer and chess (Lichess) in the terminal"
requires-python = ">=3.10"
dependencies = ["textual>=0.80", "httpx>=0.27", "chess>=1.10"]

[project.scripts]
spiel = "tui_games.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tui_games*"]

[tool.setuptools.package-data]
"tui_games.learn" = ["**/content/*.json", "**/content/*.txt"]
"tui_games.sudoku" = ["puzzles/*.json"]
