[project]
name = "spiel"
version = "0.1.0"
description = "TypeRacer and chess (Lichess) in the terminal"
requires-python = ">=3.10"
dependencies = ["textual>=0.80", "httpx>=0.27", "chess>=1.10", "pygame>=2.5", "mutagen>=1.47"]

[project.scripts]
spiel = "src.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.learn" = ["**/content/*.json", "**/content/*.txt"]
"src.sudoku" = ["puzzles/*.json"]
"src.chess" = ["eco.json"]
